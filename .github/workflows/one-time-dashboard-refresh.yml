name: One-time owner dashboard refresh fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply owner dashboard improvements
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('lib/features/owner/screens/owner_dashboard_screen.dart')
          text = dashboard.read_text(encoding='utf-8-sig')
          changed = False

          if "String _restaurantStatus = 'unknown';" not in text:
              text = text.replace(
                  "  String _restaurantName = '';\n",
                  "  String _restaurantName = '';\n  String _restaurantStatus = 'unknown';\n", 1)
              changed = True

          if "await _refreshRestaurantStatus();" not in text:
              text = text.replace(
                  "      await _refreshSubscription();\n",
                  "      await _refreshSubscription();\n      await _refreshRestaurantStatus();\n", 1)
              changed = True

          if "Future<void> _refreshRestaurantStatus() async" not in text:
              marker = "  String _dateOnly(DateTime date) =>\n"
              method = '''  Future<void> _refreshRestaurantStatus() async {\n    try {\n      final response = await _supabase\n          .from('restaurants')\n          .select('is_active')\n          .eq('id', widget.restaurantId)\n          .maybeSingle();\n\n      if (!mounted) return;\n      setState(() {\n        _restaurantStatus = response == null\n            ? 'unknown'\n            : (response['is_active'] == true ? 'active' : 'pending');\n      });\n    } catch (e) {\n      debugPrint('OWNER RESTAURANT STATUS ERROR: $e');\n    }\n  }\n\n'''
              if marker not in text:
                  raise SystemExit('Restaurant status insertion marker not found')
              text = text.replace(marker, method + marker, 1)
              changed = True

          old = """      setState(() {\n        _subscriptionStatus = response['status']?.toString() ?? 'active';\n        _subscriptionPlan = planName;\n        _subscriptionEnd = end == null ? '' : _dateOnly(end);\n        _subscriptionBilling = response['billing_cycle']?.toString() ?? '';\n      });"""
          new = """      final rawStatus = response['status']?.toString().toLowerCase() ?? 'active';\n      final isExpired = end != null && !end.isAfter(DateTime.now());\n\n      setState(() {\n        _subscriptionStatus = isExpired && rawStatus == 'active'\n            ? 'expired'\n            : rawStatus;\n        _subscriptionPlan = planName;\n        _subscriptionEnd = end == null ? '' : _dateOnly(end);\n        _subscriptionBilling = response['billing_cycle']?.toString() ?? '';\n      });"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """      case 'suspended':\n      case 'cancelled':\n        return Colors.red;\n      default:"""
          new = """      case 'suspended':\n      case 'cancelled':\n      case 'expired':\n        return Colors.red;\n      default:"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = """      case 'cancelled':\n        return 'Cancelled';\n      default:\n        return 'No Subscription';"""
          new = """      case 'cancelled':\n        return 'Cancelled';\n      case 'expired':\n        return 'Expired';\n      default:\n        return 'No Subscription';"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          if "Widget _buildRestaurantStatusCard()" not in text:
              marker = "  Widget _buildSubscriptionCard() {\n"
              card = '''  Widget _buildRestaurantStatusCard() {\n    final isActive = _restaurantStatus == 'active';\n    final color = isActive ? Colors.green : Colors.orange;\n    final label = isActive ? 'Active' : 'Pending Approval';\n\n    return Card(\n      child: Padding(\n        padding: const EdgeInsets.all(18),\n        child: Row(\n          children: [\n            Container(\n              width: 50,\n              height: 50,\n              decoration: BoxDecoration(\n                color: color.withValues(alpha: 0.10),\n                borderRadius: BorderRadius.circular(14),\n              ),\n              child: Icon(Icons.storefront_rounded, color: color, size: 27),\n            ),\n            const SizedBox(width: 14),\n            const Expanded(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n                  Text('Restaurant Status', style: TextStyle(fontSize: 13, color: HalalFoodTheme.textSecondary)),\n                  SizedBox(height: 3),\n                  Text('Store availability and approval status', style: TextStyle(fontSize: 12, color: HalalFoodTheme.textSecondary)),\n                ],\n              ),\n            ),\n            Container(\n              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),\n              decoration: BoxDecoration(\n                color: color.withValues(alpha: 0.10),\n                borderRadius: BorderRadius.circular(20),\n              ),\n              child: Text(\n                label,\n                style: TextStyle(fontSize: 11, fontWeight: FontWeight.w800, color: color),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n'''
              if marker not in text:
                  raise SystemExit('Subscription card marker not found')
              text = text.replace(marker, card + marker, 1)
              changed = True

          old = """        _buildWelcomeCard(),\n        const SizedBox(height: 16),\n        _buildSubscriptionCard(),"""
          new = """        _buildWelcomeCard(),\n        const SizedBox(height: 16),\n        _buildRestaurantStatusCard(),\n        const SizedBox(height: 12),\n        _buildSubscriptionCard(),"""
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          dashboard.write_text(text, encoding='utf-8')

          profile = Path('lib/features/owner/screens/owner_restaurant_profile_screen.dart')
          ptext = profile.read_text(encoding='utf-8-sig')
          old = """      if (!mounted) return;\n      setState(() => _isSaving = false);\n      _showMessage('Restaurant profile updated successfully.');"""
          new = """      if (!mounted) return;\n      setState(() => _isSaving = false);\n      _showMessage('Restaurant profile updated successfully.');\n      Navigator.of(context).pop(true);"""
          if old in ptext:
              profile.write_text(ptext.replace(old, new, 1), encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/owner/screens/owner_dashboard_screen.dart lib/features/owner/screens/owner_restaurant_profile_screen.dart
          git rm .github/workflows/one-time-dashboard-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete owner dashboard status and expiry"
          git push
