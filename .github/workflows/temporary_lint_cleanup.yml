name: Temporary lint cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lint cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/features/developer/screens/developer_branding_screen.dart': [
                  ('builder: (_, value, __) =>', 'builder: (_, value, _) =>'),
              ],
              'lib/features/owner/screens/owner_promo_management_screen.dart': [
                  ('separatorBuilder: (_, __) =>', 'separatorBuilder: (_, _) =>'),
              ],
              'lib/features/owner/screens/owner_dashboard_screen.dart': [
                  ('  Future<void> _refreshSubscription() async=>_loadSubscription();\n', ''),
              ],
              'lib/features/owner/screens/owner_subscribe_screen.dart': [
                  ('    if (await _hasBlockingSubscription()) return;\n\n    final planId', '    if (await _hasBlockingSubscription()) return;\n    if (!mounted) return;\n\n    final planId'),
                  ('subscriptionId: subscriptionId!,', 'subscriptionId: subscriptionId,'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes made to {filename}; expected pattern not found')
              path.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/developer/screens/developer_branding_screen.dart lib/features/owner/screens/owner_dashboard_screen.dart lib/features/owner/screens/owner_promo_management_screen.dart lib/features/owner/screens/owner_subscribe_screen.dart
          git commit -m "chore: clean flutter analyzer lints"
          git push
