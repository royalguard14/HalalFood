name: Fix subscription dialog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: subscription add edit lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch subscription dialog
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/admin/screens/admin_subscription_management_screen.dart')
          text = path.read_text()

          start = text.index('  Future<void> _showPlanDialog([Map<String, dynamic>? existing]) async {')
          end = text.index('  Future<void> _deletePlan(Map<String, dynamic> plan) async {', start)

          replacement = r'''  Future<void> _showPlanDialog([Map<String, dynamic>? existing]) async {
    final saved = await showDialog<bool>(
      context: context,
      builder: (dialogContext) => _PlanDialog(
        supabase: _supabase,
        existing: existing,
      ),
    );

    if (saved == true && mounted) {
      await _load();
    }
  }

'''

          text = text[:start] + replacement + text[end:]

          marker = '\nclass _Summary extends StatelessWidget {'
          helper = r'''
class _PlanDialog extends StatefulWidget {
  final SupabaseClient supabase;
  final Map<String, dynamic>? existing;

  const _PlanDialog({
    required this.supabase,
    this.existing,
  });

  @override
  State<_PlanDialog> createState() => _PlanDialogState();
}

class _PlanDialogState extends State<_PlanDialog> {
  late final TextEditingController _name;
  late final TextEditingController _price;
  late final TextEditingController _description;
  late final TextEditingController _features;
  final _formKey = GlobalKey<FormState>();

  bool _saving = false;
  String? _error;

  bool get _editing => widget.existing != null;

  @override
  void initState() {
    super.initState();
    final existing = widget.existing;
    _name = TextEditingController(text: existing?['name']?.toString() ?? '');
    _price = TextEditingController(
      text: existing?['monthly_price']?.toString() ?? '',
    );
    _description = TextEditingController(
      text: existing?['description']?.toString() ?? '',
    );
    _features = TextEditingController(
      text: existing?['features'] is List
          ? (existing!['features'] as List).join(', ')
          : '',
    );
  }

  @override
  void dispose() {
    _name.dispose();
    _price.dispose();
    _description.dispose();
    _features.dispose();
    super.dispose();
  }

  Future<void> _save() async {
    if (_saving) return;
    if (!(_formKey.currentState?.validate() ?? false)) return;

    setState(() {
      _saving = true;
      _error = null;
    });

    try {
      final featureList = _features.text
          .split(',')
          .map((e) => e.trim())
          .where((e) => e.isNotEmpty)
          .toList();

      final values = <String, dynamic>{
        'name': _name.text.trim(),
        'monthly_price': double.parse(_price.text.trim()),
        'description': _description.text.trim(),
        'features': featureList,
      };

      if (_editing) {
        await widget.supabase
            .from('subscription_plans')
            .update(values)
            .eq('id', widget.existing!['id']);
      } else {
        await widget.supabase.from('subscription_plans').insert(values);
      }

      if (!mounted) return;
      Navigator.of(context).pop(true);
    } catch (e) {
      if (!mounted) return;
      setState(() {
        _saving = false;
        _error = 'Unable to save plan: $e';
      });
    }
  }

  @override
  Widget build(BuildContext context) {
    return AlertDialog(
      title: Text(_editing ? 'Edit Subscription Plan' : 'Add Subscription Plan'),
      content: SizedBox(
        width: 420,
        child: Form(
          key: _formKey,
          child: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextFormField(
                  controller: _name,
                  enabled: !_saving,
                  decoration: const InputDecoration(labelText: 'Plan name'),
                  validator: (v) =>
                      v == null || v.trim().isEmpty ? 'Required' : null,
                ),
                TextFormField(
                  controller: _price,
                  enabled: !_saving,
                  keyboardType: const TextInputType.numberWithOptions(
                    decimal: true,
                  ),
                  decoration: const InputDecoration(
                    labelText: 'Monthly price (PHP)',
                  ),
                  validator: (v) => double.tryParse(v?.trim() ?? '') == null
                      ? 'Enter a valid price'
                      : null,
                ),
                TextFormField(
                  controller: _description,
                  enabled: !_saving,
                  decoration: const InputDecoration(labelText: 'Description'),
                ),
                TextFormField(
                  controller: _features,
                  enabled: !_saving,
                  maxLines: 3,
                  decoration: const InputDecoration(
                    labelText: 'Features (comma separated)',
                  ),
                ),
                if (_error != null)
                  Padding(
                    padding: const EdgeInsets.only(top: 12),
                    child: Text(
                      _error!,
                      style: const TextStyle(color: Colors.red),
                    ),
                  ),
              ],
            ),
          ),
        ),
      ),
      actions: [
        TextButton(
          onPressed: _saving ? null : () => Navigator.of(context).pop(false),
          child: const Text('Cancel'),
        ),
        ElevatedButton(
          onPressed: _saving ? null : _save,
          child: _saving
              ? const SizedBox(
                  width: 18,
                  height: 18,
                  child: CircularProgressIndicator(strokeWidth: 2),
                )
              : const Text('Save'),
        ),
      ],
    );
  }
}
'''

          if marker not in text:
              raise SystemExit('Could not find _Summary marker')
          text = text.replace(marker, '\n' + helper + marker, 1)

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -n "_PlanDialog\|_showPlanDialog" lib/features/admin/screens/admin_subscription_management_screen.dart
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/admin/screens/admin_subscription_management_screen.dart
          git commit -m "fix: subscription add edit lifecycle"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix_subscription_dialog.yml
          git commit -m "chore: remove one-time subscription fix workflow"
          git push
