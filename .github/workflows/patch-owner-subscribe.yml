name: Patch owner subscribe navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/owner/screens/owner_dashboard_screen.dart')
          s = p.read_text(encoding='utf-8-sig')
          imp = "import 'owner_subscribe_screen.dart';"
          if imp not in s:
              marker = "import 'owner_restaurant_selection_screen.dart';"
              s = s.replace(marker, marker + "\n" + imp, 1)
          marker = "        _buildSubscriptionCard(),\n        const SizedBox(height: 16),"
          button = '''        _buildSubscriptionCard(),\n        const SizedBox(height: 10),\n        SizedBox(\n          width: double.infinity,\n          child: ElevatedButton.icon(\n            onPressed: () async {\n              await Navigator.of(context).push(\n                MaterialPageRoute(\n                  builder: (_) => OwnerSubscribeScreen(\n                    restaurantId: widget.restaurantId,\n                    restaurantName: _restaurantName,\n                  ),\n                ),\n              );\n              if (mounted) await _refreshSubscription();\n            },\n            icon: const Icon(Icons.workspace_premium_rounded),\n            label: Text(_subscriptionStatus == 'active' ? 'Manage Subscription' : 'Choose Subscription Plan', style: const TextStyle(fontWeight: FontWeight.w800)),\n          ),\n        ),\n        const SizedBox(height: 16),'''
          if marker in s and 'Choose Subscription Plan' not in s:
              s = s.replace(marker, button, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/owner/screens/owner_dashboard_screen.dart
          git rm .github/workflows/patch-owner-subscribe.yml
          git commit -m "feat: add owner subscription navigation"
          git push
