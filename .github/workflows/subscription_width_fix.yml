name: Repair subscription dialog

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: subscription add edit lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.request

          path = Path('lib/features/admin/screens/admin_subscription_management_screen.dart')
          text = path.read_text()
          old = '''              SizedBox(
                height: 44,
                child: ElevatedButton.icon(
                  onPressed: () => _showPlanDialog(),
                  icon: const Icon(Icons.add_rounded),
                  label: const Text('Add Plan'),
                ),
              ),'''
          new = '''              SizedBox(
                width: 120,
                height: 44,
                child: ElevatedButton.icon(
                  style: ElevatedButton.styleFrom(
                    minimumSize: Size.zero,
                    padding: const EdgeInsets.symmetric(horizontal: 14),
                  ),
                  onPressed: () => _showPlanDialog(),
                  icon: const Icon(Icons.add_rounded),
                  label: const Text('Add Plan'),
                ),
              ),'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              print('Add Plan block already repaired or not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/admin/screens/admin_subscription_management_screen.dart
          git commit -m "fix: subscription add edit lifecycle" || exit 0
          git push
